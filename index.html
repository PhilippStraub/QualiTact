<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QualiTact-AI Modell</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23ffc107'/%3E%3Ctext x='50' y='70' font-size='60' font-weight='bold' text-anchor='middle' fill='%23fff'%3EQ%3C/text%3E%3C/svg%3E">
  <script src="https://unpkg.com/n3@1.14.0/browser/n3.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js" crossorigin="anonymous"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jstree@3.3.12/dist/themes/default/style.min.css" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/jstree@3.3.12/dist/jstree.min.js" crossorigin="anonymous"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" crossorigin="anonymous">

</head>
<body>

  <div class="container-fluid">
    <div class="row">
      <div class="col-12 col-md-4" id="filterbar">
        <div class="filters" id="correlationfilter">
          <label>Filter Scores:</label><br>
          <div id="kanten">
            <button class="btn btn-warning btn-sm" id="selectAllEdges">Show All</button>
            <button class="btn btn-outline-secondary btn-sm" id="selectCorrelation">Value Only</button>
            <button class="btn btn-outline-secondary btn-sm" id="selectName">Label Only</button>
            <button class="btn btn-outline-secondary btn-sm" id="selectEmpty">No Values</button>
          </div><br>
          <label class="correlationsvalue" for="correlationSlider">Score Value (positive & negative values):</label><br>
          <input type="range" class="slider" id="correlationSlider" min="0" max="1" step="0.01" value="0.2">
          <input type="number" class="form-control" id="correlationInput" min="0" max="1" step="0.01" value="0.2"><br>
          <div class="posNeg">
            <div class="form-check form-switch form-check-inline" id="positiveBox">
              <input class="form-check-input" type="checkbox" id="showPositive" name="showPositive" checked><label class="form-check-label" for="showPositive">positive values</label>
            </div>
            <div class="form-check form-switch form-check-inline">
              <input class="form-check-input" type="checkbox" id="showNegative" name="showNegative" checked><label class="form-check-label" for="showNegative">negative values</label>
            </div>
          </div>
            <div class="d-flex justify-content-between align-items-center">
              <label class="correlationsvalue mb-0" id="filtersCollapseHead">More Filters</label>
              <button id="addFiltersButton" class="btn btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#filtersCollapse" aria-expanded="false" aria-controls="filtersCollapse">
                <i class="bi bi-chevron-down"></i>
              </button>
            </div>

            <div class="collapse hide mt-2" id="filtersCollapse">
              <div class="ps-2" id="sub-filtersCollapse">
                <div class="addfilters block" id="sub-sub-filtersCollapse">
                  <label class="otherFilters" for="certaintySlider">Confidence Value (Percentage)</label><br>
                  <input type="range" class="slider" id="certaintySlider" min="0" max="1" step="0.01" value="0.0" disabled>
                  <input type="number" class="form-control" id="certaintyInput" min="0" max="1" step="0.01" value="0.0" disabled><br>

                  <label class="otherFilters" for="correlationTacticSlider" id="correlationTacticsHead">Score Value between Tactics</label><br>
                  <input type="range" class="slider" id="correlationTacticSlider" min="0" max="1" step="0.01" value="1.0">
                  <input type="number" class="form-control" id="correlationTacticsInput" min="0" max="1" step="0.01" value="1.0">
                </div>
              </div>
            </div>
        </div>



        <div class="filters">
          <label>Filter by Quality Attribute(s):</label><span class="tree_stats"><span id="stats_qa">0</span> selected</span><br>
          <div class="d-flex flex-wrap align-items-center gap-2 mb-2 searchbar">
            <input type="text" id="treeSearchQA" class="form-control flex-grow-1" placeholder="🔍 Search...">
            <div class="d-flex gap-2 searchbar-buttons">
              <button class="btn btn-warning btn-sm" id="selectAll">Select All</button>
              <button class="btn btn-outline-secondary btn-sm" id="clearAll">Clear Selection</button><br>
            </div>
          </div>
          <div id="tree-QA"class="overflow-auto"></div>
        </div>

        <div class="filters">
          <label>Filter by Tactic(s):</label><span class="tree_stats"><span id="stats_tactics">0</span> selected</span><br>
          <div class="d-flex flex-wrap align-items-center gap-2 mb-2 searchbar">
            <input type="text" id="treeSearchTactics" class="form-control flex-grow-1" placeholder="🔍 Search...">
            <div class="d-flex gap-2 searchbar-buttons">
              <button class="btn btn-warning btn-sm" id="selectAllTactics">Select All</button>
              <button class="btn btn-outline-secondary btn-sm" id="clearAllTactics">Clear Selection</button>
            </div>
          </div>
          <div id="tree-Tactics" class="overflow-auto"></div>
        </div>

      </div>
      <div class="col-12 col-md-8">
        <h2 class="display-6">QualiTact-AI Model</h2>
        <div class="row" id="upper-model">
          <div class="col">
            <div id="stats">
              Number of Tactics: <span id="stats_subject">0</span> |
              Quality Attributes: <span id="stats_object">0</span>
            </div>
          </div>
          <div class="col-12 col-md-auto" id="export-area">
            <div class="dropdown">
              <button class="btn btn-secondary btn-sm dropdown-toggle" type="button" id="dropdownMenuButton1" data-bs-toggle="dropdown" aria-expanded="false">
                Export JSON
              </button>
              <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton1">
                <li><a class="dropdown-item" href="#" id="exportJson">Tactics sorted by Quality Attributes</a></li>
                <li><a class="dropdown-item" href="#" id="exportJSONTacticsOnly">Only tactics</a></li>
              </ul>
            </div>
            <div class="form-check" style="margin-top: 5px; font-size: 0.85rem;">
              <input class="form-check-input" type="checkbox" id="includeTacticRelations" unchecked>
              <label class="form-check-label" for="includeTacticRelations">
                Include tactic relations
              </label>
            </div>
          </div>
        </div>
        <div style="position: relative;">
          <div id="network"></div>
          <div id="loadingOverlay">
            <div class="loading-content">
              <div class="spinner"></div>
              <div class="loading-text">Model is loading...</div>
              <div class="progress-container">
                <div class="progress">
                  <div id="loadingProgress" class="progress-bar progress-bar-striped progress-bar-animated" 
                       role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                </div>
              </div>
              <div class="loading-details" id="loadingDetails">Calculating the network...</div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
